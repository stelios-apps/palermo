<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Παλέρμο</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif:wght@700;800&display=swap&subset=greek" rel="stylesheet">
<style>
/* ===== Design tokens (αλλάζεις χρώματα/γραμματοσειρές μόνο εδώ) ===== */
:root{
  --bg:#0d1120; --surface:#161b2e; --surface-2:#1f2540; --line:#2b3254;
  --text:#ece6da; --muted:#8d93ad;
  --accent:#c8283c; --accent-hover:#e03a4f; --gold:#d4a85a;
  --danger:#ff6b6b; --radius:14px;
  --font-body:'Inter',system-ui,sans-serif; --font-title:'Noto Serif',Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background-image:radial-gradient(900px 500px at 50% -10%,#1b2142 0%,transparent 70%)}
.screen{display:none;min-height:100%;max-width:460px;margin:0 auto;padding:28px 20px;flex-direction:column;gap:16px}
.screen.active{display:flex}
h1{font-family:var(--font-title);font-weight:800;font-size:2.6rem;letter-spacing:.02em;color:var(--gold);text-align:center;margin-top:8vh}
.tagline{text-align:center;color:var(--muted);margin-bottom:12px}
label{font-size:.85rem;color:var(--muted)}
input{width:100%;padding:15px 16px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:1.05rem;margin-top:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:1.05rem;padding:16px;border-radius:var(--radius);border:0;
  background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--accent-hover)} button:active{transform:scale(.98)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.ghost:hover{background:var(--surface)}
button:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.divider{text-align:center;color:var(--muted);font-size:.85rem}
.error{color:var(--danger);min-height:1.2em;text-align:center;font-size:.95rem}
.pin-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;display:flex;align-items:center;gap:18px}
.pin-card .pin{font-family:var(--font-title);font-size:2.8rem;letter-spacing:.12em;color:var(--gold);line-height:1}
.pin-card small{color:var(--muted);display:block;margin-bottom:6px}
#qr{background:#fff;padding:6px;border-radius:8px;line-height:0;flex-shrink:0}
.players-head{display:flex;justify-content:space-between;align-items:baseline}
.count{color:var(--muted);font-size:.9rem}
.players{list-style:none;padding:0;display:grid;gap:8px}
.players li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  display:flex;justify-content:space-between;align-items:center}
.badge{font-size:.75rem;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 10px}
.hint{color:var(--muted);font-size:.9rem;text-align:center}
.spacer{flex:1}
.group-title{font-family:var(--font-title);font-size:1.1rem;margin:14px 0 2px}
.group-title.mafia{color:var(--accent-hover)} .group-title.city{color:#7fb4ff} .group-title.neutral{color:var(--gold)}
.role-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.role-info{min-width:0} .role-info small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;line-height:1.35}
.stepper{display:flex;align-items:center;gap:10px;flex-shrink:0}
.stepper span,.auto{min-width:22px;text-align:center;font-weight:700;font-size:1.1rem}
.auto{color:var(--muted)}
.stepper button{padding:0;width:38px;height:38px;font-size:1.3rem;background:var(--surface-2);border:1px solid var(--line)}
.stepper button:hover{background:var(--line)}
.summary{background:var(--surface-2);border-radius:12px;padding:14px;font-size:.95rem;line-height:1.6;position:sticky;top:0;z-index:2;border:1px solid var(--line)}
.summary .bad{color:var(--danger)} .summary .warn{color:var(--gold)} .summary .ok{color:#6fd39a}
.chip{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px;cursor:pointer;color:var(--text);font-size:1rem}
.chip small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.chip input{width:22px;height:22px;margin:0;padding:0;accent-color:var(--accent);flex-shrink:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ΑΡΧΙΚΗ -->
<section id="home" class="screen active">
  <h1>ΠΑΛΕΡΜΟ</h1>
  <p class="tagline">Η νύχτα έπεσε. Ποιος είναι ποιος;</p>
  <div><label for="name">Το όνομά σου</label>
    <input id="name" maxlength="14" autocomplete="off" placeholder="π.χ. Νίκος"></div>
  <button id="btnCreate">Δημιουργία δωματίου</button>
  <div class="divider">ή μπες σε δωμάτιο που υπάρχει</div>
  <div><label for="pin">PIN δωματίου</label>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 ψηφία"></div>
  <button id="btnJoin" class="ghost">Είσοδος</button>
  <p class="error" id="homeError"></p>
  <button id="btnAdminOpen" class="ghost" style="padding:10px;font-size:.85rem;margin-top:auto">Admin</button>
</section>

<!-- ΣΥΝΔΕΣΗ ADMIN -->
<section id="admin" class="screen">
  <h1 style="font-size:2rem">Admin</h1>
  <div><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="username"></div>
  <div><label for="aPass">Κωδικός</label><input id="aPass" type="password" autocomplete="current-password"></div>
  <button id="btnAdminLogin">Σύνδεση</button>
  <button id="btnAdminBack" class="ghost">Πίσω</button>
  <p class="error" id="adminError"></p>
</section>

<!-- ΑΝΑΜΟΝΗ (LOBBY) -->
<section id="lobby" class="screen">
  <div class="pin-card">
    <div id="qr"></div>
    <div><small>PIN δωματίου</small><div class="pin" id="pinShow">----</div></div>
  </div>
  <div class="players-head"><strong>Παίκτες</strong><span class="count" id="count"></span></div>
  <ul class="players" id="players"></ul>
  <div class="spacer"></div>
  <div id="adminTools" style="display:none;gap:8px;flex-direction:column">
    <span class="badge" style="align-self:center">Admin · δοκιμαστική λειτουργία</span>
    <button id="btnAddBot" class="ghost">+ Δοκιμαστικός παίκτης</button>
    <button id="btnClearBots" class="ghost">Αφαίρεση δοκιμαστικών</button>
  </div>
  <p class="hint" id="lobbyHint"></p>
  <button id="btnStart" style="display:none" disabled>Ρυθμίσεις παιχνιδιού</button>
  <button id="btnLeave" class="ghost">Έξοδος</button>
</section>

<!-- ΡΥΘΜΙΣΕΙΣ HOST -->
<section id="setup" class="screen">
  <h1 style="font-size:1.8rem;margin-top:0">Ρυθμίσεις παιχνιδιού</h1>
  <p class="tagline" style="margin:0">Παίκτες στο δωμάτιο: <strong id="setupN"></strong></p>
  <div class="summary" id="setupSummary"></div>
  <button id="btnSuggest" class="ghost">Αυτόματη πρόταση ρόλων</button>
  <div id="setupRoles"></div>
  <h3 class="group-title" style="color:var(--gold)">Κάρτες</h3>
  <label class="chip"><span>Κάρτα σε όλους κάθε πρωί<small>Αν το κλείσεις, δεν μοιράζονται κάρτες</small></span>
    <input type="checkbox" id="dealCards"></label>
  <div id="setupCards"></div>
  <div class="error" id="setupError"></div>
  <button id="btnSaveSetup">Αποθήκευση ρυθμίσεων</button>
  <button id="btnSetupBack" class="ghost">Πίσω</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCZXL5WIobetpI7KqnHIPRKjdfyVGIR09o",
  authDomain: "palermo-6e0bc.firebaseapp.com",
  databaseURL: "https://palermo-6e0bc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "palermo-6e0bc",
  storageBucket: "palermo-6e0bc.firebasestorage.app",
  messagingSenderId: "575013502874",
  appId: "1:575013502874:web:bedc9d19202307dfd00423"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const MIN_PLAYERS = 4, MAX_PLAYERS = 15;

/* ===== Ρόλοι ===== */
const ROLES = [
 {id:'godfather',team:'mafia',name:'Αρχιμαφιόζος',desc:'Ο Αστυνόμος τον βλέπει «Αθώο». Έχει τον τελικό λόγο στη δολοφονία.',max:1},
 {id:'goon',team:'mafia',name:'Μαφιόζος',desc:'Ο βασικός ρόλος της Μαφίας. Ψηφίζει το θύμα.',max:4},
 {id:'saboteur',team:'mafia',name:'Σαμποτέρ',desc:'Κάθε νύχτα μπλοκάρει τη δύναμη ενός παίκτη.',max:2},
 {id:'blackmailer',team:'mafia',name:'Εκβιαστής',desc:'Ο στόχος του δεν μπορεί να ψηφίσει την επόμενη μέρα.',max:1},
 {id:'framer',team:'mafia',name:'Σκηνοθέτης',desc:'Ενοχοποιεί παίκτη: ο Αστυνόμος τον βλέπει Μαφία.',max:1},
 {id:'citizen',team:'city',name:'Πολίτης',desc:'Χωρίς δύναμη. Συμπληρώνεται αυτόματα.'},
 {id:'doctor',team:'city',name:'Γιατρός',desc:'Προστατεύει έναν παίκτη κάθε νύχτα.',max:2},
 {id:'cop',team:'city',name:'Αστυνόμος',desc:'Ελέγχει αν ένας παίκτης είναι Μαφία.',max:2},
 {id:'swapper',team:'city',name:'Νοθευτής',desc:'Ανταλλάσσει τις ψήφους δύο παικτών.',max:1},
 {id:'tracker',team:'city',name:'Ιχνηλάτης',desc:'Μαθαίνει αν ο στόχος του έκανε κάτι τη νύχτα.',max:1},
 {id:'sniper',team:'city',name:'Σκοπευτής',desc:'Μία σφαίρα. Αν πετύχει την Πόλη, πεθαίνει κι αυτός.',max:1},
 {id:'bodyguard',team:'city',name:'Σωματοφύλακας',desc:'Πεθαίνει στη θέση αυτού που προστατεύει.',max:1},
 {id:'jester',team:'neutral',name:'Τρελός',desc:'Κερδίζει μόνος αν αποχωρήσει με ψηφοφορία.',max:1}
];
/* ===== Κάρτες ===== */
const CARDS = [
 {id:'double',r:'Κοινή',name:'Διπλή Ψήφος',desc:'Η ψήφος σου μετράει για 2'},
 {id:'spotlight',r:'Κοινή',name:'Προβολέας',desc:'Η ψηφοφορία γίνεται φανερή'},
 {id:'gag',r:'Κοινή',name:'Φίμωτρο',desc:'Ο στόχος σιωπά όλη τη μέρα'},
 {id:'thief',r:'Κοινή',name:'Κλέφτης',desc:'Κλέβεις τυχαία κάρτα άλλου'},
 {id:'whisper',r:'Κοινή',name:'Ψίθυρος',desc:'Ιδιωτικό μήνυμα σε έναν παίκτη'},
 {id:'suspect',r:'Κοινή',name:'Ύποπτος',desc:'Σημαδεύεις κάποιον· αν φύγει και είναι Μαφία, παίρνεις 2 κάρτες'},
 {id:'swap',r:'Κοινή',name:'Ανταλλαγή',desc:'Αλλάζεις κάρτα με κάποιον'},
 {id:'peek',r:'Κοινή',name:'Ματιά',desc:'Βλέπεις μια τυχαία κάρτα άλλου'},
 {id:'blank',r:'Κοινή',name:'Κενή κάρτα',desc:'Δεν κάνει τίποτα. Καλή για μπλόφα'},
 {id:'shield',r:'Σπάνια',name:'Ασπίδα',desc:'Ακυρώνει όλες τις ψήφους πάνω σου'},
 {id:'mirror',r:'Σπάνια',name:'Αντανακλαστικό',desc:'Οι ψήφοι εναντίον σου γυρνούν σε αυτούς που ψήφισαν'},
 {id:'blind',r:'Σπάνια',name:'Τυφλή Δικαιοσύνη',desc:'Ακυρώνει τον Προβολέα'},
 {id:'cancel',r:'Σπάνια',name:'Άκυρο',desc:'Ακυρώνει κάρτα που μόλις παίχτηκε'},
 {id:'alibi',r:'Σπάνια',name:'Άλλοθι',desc:'Δεν γίνεσαι στόχος Φίμωτρου ή Κλέφτη σήμερα'},
 {id:'puppet',r:'Σπάνια',name:'Μαριονέτα',desc:'Η ψήφος ενός παίκτη πηγαίνει εκεί που θες'},
 {id:'second',r:'Σπάνια',name:'Δεύτερη Ευκαιρία',desc:'Επαναψηφοφορία μία φορά'},
 {id:'banish',r:'Σπάνια',name:'Οριστική Έξοδος',desc:'Βγάζει νεκρό παίκτη οριστικά και αποκαλύπτει τον ρόλο του'},
 {id:'revive',r:'Επική',name:'Ανάσταση',desc:'Ζωντανεύει έναν νεκρό παίκτη'},
 {id:'seance',r:'Επική',name:'Σπιριτισμός',desc:'Για έναν γύρο μιλούν και ψηφίζουν όλοι, και οι νεκροί'},
 {id:'postpone',r:'Επική',name:'Αναβολή',desc:'Σήμερα δεν φεύγει κανείς'}
];

/* ===== Αυτόματη πρόταση ρόλων ανά αριθμό παικτών ===== */
function suggest(n){
  const r = {godfather:1, doctor:1, cop:1};
  if (n >= 6) r.goon = 1;
  if (n >= 7) r.swapper = 1;
  if (n >= 8) r.saboteur = 1;
  if (n >= 9) r.tracker = 1;
  if (n >= 10) r.bodyguard = 1;
  if (n >= 11) { r.blackmailer = 1; r.goon = 2; }
  if (n >= 12) r.sniper = 1;
  if (n >= 14) { r.framer = 1; r.jester = 1; r.goon = 3; }
  return r;
}

/* ===== Οθόνη ρυθμίσεων Host ===== */
let lastCount = 0, lastRoom = null;
let cfg = { roles: {}, dealCards: true, cards: new Set(CARDS.map(c => c.id)) };
const sumOthers = () => Object.entries(cfg.roles).reduce((a, [id, c]) => a + (id === 'citizen' ? 0 : c), 0);
const citizenCount = () => Math.max(0, lastCount - sumOthers());
const teamCount = team => ROLES.filter(r => r.team === team).reduce((a, r) => a + (r.id === 'citizen' ? citizenCount() : (cfg.roles[r.id] || 0)), 0);

function openSetup(){
  const saved = lastRoom && lastRoom.config;
  if (saved) {
    cfg.roles = Object.assign({}, saved.roles); delete cfg.roles.citizen;
    cfg.dealCards = saved.dealCards; cfg.cards = new Set(saved.cards || []);
  } else { cfg.roles = suggest(lastCount); }
  $('setupN').textContent = lastCount; $('dealCards').checked = cfg.dealCards;
  renderRoles(); renderCards(); show('setup');
}
function renderRoles(){
  const box = $('setupRoles'); box.innerHTML = '';
  [['mafia','Μαφία'],['city','Πόλη'],['neutral','Ουδέτεροι']].forEach(([team, title]) => {
    const h = document.createElement('h3'); h.className = 'group-title ' + team; h.textContent = title; box.appendChild(h);
    ROLES.filter(r => r.team === team).forEach(r => {
      const auto = r.id === 'citizen', count = auto ? citizenCount() : (cfg.roles[r.id] || 0);
      const row = document.createElement('div'); row.className = 'role-row';
      row.innerHTML = '<div class="role-info"><strong></strong><small></small></div>' + (auto
        ? `<span class="auto">${count}</span>`
        : `<div class="stepper"><button data-id="${r.id}" data-d="-1" aria-label="Λιγότεροι">−</button><span>${count}</span><button data-id="${r.id}" data-d="1" aria-label="Περισσότεροι">+</button></div>`);
      row.querySelector('strong').textContent = r.name; row.querySelector('small').textContent = r.desc;
      box.appendChild(row);
    });
  });
  renderSummary();
}
function renderSummary(){
  const m = teamCount('mafia'), c = teamCount('city'), j = teamCount('neutral');
  let msg = '', ok = true;
  if (sumOthers() > lastCount) { msg = `<span class="bad">Οι ρόλοι (${sumOthers()}) είναι περισσότεροι από τους παίκτες (${lastCount}).</span>`; ok = false; }
  else if (m < 1) { msg = '<span class="bad">Χρειάζεται τουλάχιστον 1 Μαφιόζος.</span>'; ok = false; }
  else if (c < 1) { msg = '<span class="bad">Χρειάζεται τουλάχιστον 1 από την Πόλη.</span>'; ok = false; }
  else if (m >= c) msg = '<span class="warn">Η Μαφία είναι ίση ή περισσότερη από την Πόλη. Θα νικήσει πολύ γρήγορα.</span>';
  else if (m * 3 < c) msg = '<span class="warn">Πολύ λίγη Μαφία. Το παιχνίδι θα γείρει υπέρ της Πόλης.</span>';
  else msg = '<span class="ok">Ισορροπημένη παρτίδα ✓</span>';
  $('setupSummary').innerHTML = `Μαφία: <strong>${m}</strong> &nbsp; Πόλη: <strong>${c}</strong>` + (j ? ` &nbsp; Ουδέτεροι: <strong>${j}</strong>` : '') + '<br>' + msg;
  $('btnSaveSetup').disabled = !ok;
}
function renderCards(){
  const box = $('setupCards'); box.innerHTML = '';
  CARDS.forEach(c => {
    const l = document.createElement('label'); l.className = 'chip';
    l.innerHTML = '<span><strong></strong> <small class="r"></small><small class="d"></small></span><input type="checkbox">';
    l.querySelector('strong').textContent = c.name;
    l.querySelector('.r').textContent = '(' + c.r + ')'; l.querySelector('.r').style.display = 'inline';
    l.querySelector('.d').textContent = c.desc;
    const cb = l.querySelector('input'); cb.checked = cfg.cards.has(c.id);
    cb.onchange = () => cb.checked ? cfg.cards.add(c.id) : cfg.cards.delete(c.id);
    box.appendChild(l);
  });
}
async function saveSetup(){
  cfg.dealCards = $('dealCards').checked;
  if (cfg.dealCards && cfg.cards.size === 0) { $('setupError').textContent = 'Διάλεξε τουλάχιστον μία κάρτα ή κλείσε τις κάρτες.'; return; }
  $('setupError').textContent = '';
  const roles = {}; ROLES.forEach(r => { const n = r.id === 'citizen' ? citizenCount() : (cfg.roles[r.id] || 0); if (n > 0) roles[r.id] = n; });
  await db.ref(`rooms/${pin}/config`).set({ roles, dealCards: cfg.dealCards, cards: [...cfg.cards], playerCount: lastCount });
  buzz(); show('lobby');
}

/* ===== Βοηθητικά ===== */
const $ = id => document.getElementById(id);
const ADMIN_EMAIL = "stelios.andritsakis@gmail.com";   // <-- το email που θα φτιάξεις στο Firebase
let uid = null, pin = null, isHost = false, isAdmin = false, unsubscribe = null;

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}
function setError(msg){ $('homeError').textContent = msg || ''; }
function buzz(){ if (navigator.vibrate) navigator.vibrate(30); }
function getName(){
  const n = $('name').value.trim();
  if (!n) { setError('Γράψε πρώτα το όνομά σου.'); $('name').focus(); return null; }
  return n;
}

/* ===== Σύνδεση (ανώνυμη) ===== */
const authReady = new Promise(resolve => {
  let first = true;
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      uid = user.uid;
      isAdmin = !user.isAnonymous && user.email === ADMIN_EMAIL;
      if (first) { first = false; resolve(); }
    } else {
      firebase.auth().signInAnonymously().catch(e => setError('Πρόβλημα σύνδεσης: ' + e.code));
    }
  });
});

/* ===== Admin ===== */
async function adminLogin(){
  $('adminError').textContent = '';
  try {
    await firebase.auth().signInWithEmailAndPassword($('aEmail').value.trim(), $('aPass').value);
    if (!isAdmin) { await firebase.auth().signOut(); $('adminError').textContent = 'Αυτός ο λογαριασμός δεν είναι Admin.'; return; }
    $('aPass').value = ''; if (!$('name').value) $('name').value = 'Admin';
    show('home'); setError('Συνδέθηκες ως Admin.');
  } catch (e) { $('adminError').textContent = 'Λάθος στοιχεία (' + e.code + ')'; }
}
const BOT_NAMES = ['Νίκος','Μαρία','Γιάννης','Ελένη','Κώστας','Σοφία','Δημήτρης','Άννα','Πέτρος','Κατερίνα','Μάκης','Ζωή','Θάνος','Ιωάννα','Στέλιος'];
async function addBot(){
  const snap = await db.ref(`rooms/${pin}/players`).get();
  const players = snap.val() || {};
  if (Object.keys(players).length >= MAX_PLAYERS) return;
  const used = Object.values(players).map(p => p.name);
  const name = (BOT_NAMES.find(n => !used.includes(n)) || 'Bot' + Date.now() % 1000);
  const id = 'bot_' + Date.now().toString(36) + Math.floor(Math.random() * 99);
  await db.ref(`rooms/${pin}/players/${id}`).set({ name, bot: true, joinedAt: firebase.database.ServerValue.TIMESTAMP });
}
async function clearBots(){
  const snap = await db.ref(`rooms/${pin}/players`).get();
  const upd = {};
  Object.entries(snap.val() || {}).forEach(([id, p]) => { if (p.bot) upd[id] = null; });
  await db.ref(`rooms/${pin}/players`).update(upd);
}

/* ===== Δημιουργία δωματίου ===== */
async function createRoom(){
  const name = getName(); if (!name) return;
  setError(''); buzz(); await authReady;
  try {
    let code, tries = 0;
    do {
      code = String(Math.floor(1000 + Math.random() * 9000));
      const snap = await db.ref('rooms/' + code).get();
      if (!snap.exists()) break;
    } while (++tries < 10);
    await db.ref('rooms/' + code).set({
      host: uid, status: 'lobby', createdAt: firebase.database.ServerValue.TIMESTAMP,
      players: { [uid]: { name, joinedAt: firebase.database.ServerValue.TIMESTAMP } }
    });
    isHost = true; enterLobby(code);
  } catch (e) { setError('Δεν δημιουργήθηκε δωμάτιο: ' + e.message); }
}

/* ===== Είσοδος σε δωμάτιο ===== */
async function joinRoom(){
  const name = getName(); if (!name) return;
  const code = $('pin').value.trim();
  if (!/^\d{4}$/.test(code)) { setError('Το PIN έχει 4 ψηφία.'); return; }
  setError(''); buzz(); await authReady;
  try {
    const snap = await db.ref('rooms/' + code).get();
    if (!snap.exists()) { setError('Δεν βρέθηκε δωμάτιο με αυτό το PIN.'); return; }
    const room = snap.val();
    const already = room.players && room.players[uid];
    if (room.status !== 'lobby' && !already) { setError('Το παιχνίδι έχει ήδη ξεκινήσει.'); return; }
    if (!already && Object.keys(room.players || {}).length >= MAX_PLAYERS) { setError('Το δωμάτιο είναι γεμάτο (15).'); return; }
    await db.ref(`rooms/${code}/players/${uid}`).set({ name, joinedAt: firebase.database.ServerValue.TIMESTAMP });
    isHost = room.host === uid; enterLobby(code);
  } catch (e) { setError('Δεν έγινε είσοδος: ' + e.message); }
}

/* ===== Αναμονή: ζωντανή λίστα παικτών ===== */
function enterLobby(code){
  pin = code;
  $('pinShow').textContent = code;
  const link = location.origin + location.pathname + '?pin=' + code;
  $('qr').innerHTML = '';
  new QRCode($('qr'), { text: link, width: 110, height: 110 });
  $('btnStart').style.display = isHost ? 'block' : 'none';
  $('adminTools').style.display = (isAdmin && isHost) ? 'flex' : 'none';
  show('lobby');

  const ref = db.ref('rooms/' + code);
  const handler = ref.on('value', snap => {
    if (!snap.exists()) { leaveLocal('Το δωμάτιο έκλεισε.'); return; }
    const room = snap.val(), players = room.players || {};
    if (!players[uid]) { leaveLocal('Αφαιρέθηκες από το δωμάτιο.'); return; }
    const list = Object.entries(players).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
    lastCount = list.length; lastRoom = room;
    $('count').textContent = `${list.length} / ${MAX_PLAYERS}`;
    $('players').innerHTML = '';
    list.forEach(([id, p]) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = p.name + (id === uid ? ' (εσύ)' : '') + (p.bot ? ' 🤖' : '');
      li.appendChild(span);
      if (id === room.host) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'Host'; li.appendChild(b); }
      $('players').appendChild(li);
    });
    const enough = list.length >= MIN_PLAYERS;
    $('btnStart').disabled = !enough;
    $('lobbyHint').textContent = isHost
      ? (enough ? (room.config ? 'Ρυθμίσεις αποθηκευμένες ✓ Περίμενε να μπουν όλοι.' : 'Όλα έτοιμα. Πάτα «Ρυθμίσεις παιχνιδιού» για ρόλους και κάρτες.') : `Χρειάζονται τουλάχιστον ${MIN_PLAYERS} παίκτες.`)
      : 'Περιμένεις τον Host να ξεκινήσει το παιχνίδι…';
  });
  unsubscribe = () => ref.off('value', handler);
}

function leaveLocal(msg){
  if (unsubscribe) unsubscribe(); unsubscribe = null;
  pin = null; isHost = false; show('home'); setError(msg || '');
}
async function leaveRoom(){
  if (!pin) return;
  const code = pin; buzz();
  if (isHost) await db.ref('rooms/' + code).remove();      // ο Host κλείνει το δωμάτιο
  else await db.ref(`rooms/${code}/players/${uid}`).remove();
  leaveLocal('');
}

/* ===== Κουμπιά ===== */
$('btnCreate').onclick = createRoom;
$('btnJoin').onclick = joinRoom;
$('btnLeave').onclick = leaveRoom;
$('btnAdminOpen').onclick = () => show('admin');
$('btnAdminBack').onclick = () => show('home');
$('btnAdminLogin').onclick = adminLogin;
$('btnAddBot').onclick = addBot;
$('btnClearBots').onclick = clearBots;
$('btnStart').onclick = openSetup;
$('btnSetupBack').onclick = () => show('lobby');
$('btnSaveSetup').onclick = saveSetup;
$('btnSuggest').onclick = () => { cfg.roles = suggest(lastCount); renderRoles(); };
$('setupRoles').onclick = e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const id = b.dataset.id, role = ROLES.find(r => r.id === id), d = +b.dataset.d;
  const cur = cfg.roles[id] || 0, next = cur + d;
  if (next < 0 || next > (role.max || 1)) return;
  if (d > 0 && sumOthers() >= lastCount) return;
  cfg.roles[id] = next; renderRoles();
};

// Αν ήρθε από QR (?pin=1234), συμπληρώνεται αυτόματα
const urlPin = new URLSearchParams(location.search).get('pin');
if (urlPin) $('pin').value = urlPin.slice(0, 4);
</script>
